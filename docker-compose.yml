services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-zmien-mnie}
      ADMIN_SECRET: ${ADMIN_SECRET:-zmien-na-dlugi-losowy-ciag-znakow}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    volumes:
      - ./content:/app/content
    restart: unless-stopped
