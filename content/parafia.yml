name: Parafia św. Wawrzyńca
shortName: św. Wawrzyniec
patron: św. Wawrzyniec, diakon i męczennik
feastDay: 10 sierpnia
erected: 2 marca 2014
diocese: Archidiecezja Katowicka
deanery: Dekanat Wodzisław Śląski
motto: Ci ubodzy są skarbem Kościoła.

