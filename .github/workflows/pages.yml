name: GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Resolve Pages URL
        id: pages
        run: |
          if [ "${{ vars.PAGES_BASE_PATH }}" = "/" ] || [ "${{ vars.PAGES_BASE_PATH }}" = "root" ]; then
            echo "base=" >> "$GITHUB_OUTPUT"
            echo "url=https://${{ github.repository_owner }}.github.io" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ vars.PAGES_BASE_PATH }}" ]; then
            echo "base=${{ vars.PAGES_BASE_PATH }}" >> "$GITHUB_OUTPUT"
            echo "url=https://${{ github.repository_owner }}.github.io${{ vars.PAGES_BASE_PATH }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
            echo "url=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
          fi
      - run: pnpm install --frozen-lockfile
      - name: Build static site
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.url }}
        run: pnpm build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
